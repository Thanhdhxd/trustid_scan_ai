name: trustid_scan_ai
description: "Demo tách luồng quét mã QR + AI phát hiện bất thường (TrustID)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  mobile_scanner: ^6.0.0
  geolocator: ^13.0.0
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_widget_from_html: ^0.17.2
  url_launcher: ^6.3.2
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  carousel_slider: ^5.1.2
  image_picker: ^1.2.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
